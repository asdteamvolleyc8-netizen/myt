# Ogni 20 minuti copia le pagine FIPAV della societa' nel ramo "dati".
# L'app MyT le legge da qui quando il sito FIPAV blocca Google.
name: Copia pagine FIPAV
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lettore/**, .github/workflows/copia-fipav.yml]
permissions:
  contents: write
concurrency:
  group: copia-fipav
  cancel-in-progress: false
jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scarica le pagine FIPAV
        run: python3 lettore/scarica_fipav.py uscita/fipav
      - name: Pubblica nel ramo dati
        run: |
          cd uscita
          git init -q -b dati
          git config user.name "MyT lettore"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Pagine FIPAV $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dati
