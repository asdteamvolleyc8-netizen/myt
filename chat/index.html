<!-- =====================================================
     CHAT MyT: la giocatrice virtuale del Team Volley C8
     Si aggiunge a una pagina con una sola riga, prima di </body>:
         <?!= include('ChatMyT'); ?>
     Le risposte arrivano da ChatMyT.gs (chiediMyT).
===================================================== -->
<style>
  #mytc {
    --mytc-blu: #1a2a7c;
    --mytc-blu-scuro: #101b57;
    --mytc-blu-chiaro: #e9edff;
    --mytc-oro: #d39b36;
    --mytc-oro-vivo: #f1c56a;
    --mytc-oro-chiaro: #fbf0d9;
    --mytc-testo: #151a33;
    --mytc-testo-2: #5c6079;
    --mytc-linea: #e5e8f2;
    --mytc-verde: #1d7a46;
    --mytc-verde-chiaro: #e3f5ea;
    --mytc-rosso: #b4233a;
    --mytc-rosso-chiaro: #fde8eb;
    font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--mytc-testo);
    -webkit-text-size-adjust: 100%;
  }
  #mytc *, #mytc *::before, #mytc *::after { box-sizing: border-box; }

  /* ---------- Bottone tondo con la giocatrice ---------- */
  #mytc .mytc-apri {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    z-index: 9000;
    width: 64px;
    height: 64px;
    padding: 0;
    border: 3px solid var(--mytc-oro-vivo);
    border-radius: 50%;
    background: var(--mytc-blu);
    box-shadow: 0 6px 18px rgba(16, 27, 87, .35);
    cursor: pointer;
    transition: transform .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #mytc .mytc-apri:hover { transform: scale(1.06); }
  #mytc .mytc-apri:focus-visible { outline: 3px solid var(--mytc-oro); outline-offset: 3px; }
  #mytc .mytc-apri svg { display: block; width: 100%; height: 100%; border-radius: 50%; }
  #mytc .mytc-badge {
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 2px solid #fff;
    border-radius: 50%;
    background: var(--mytc-oro);
    color: var(--mytc-blu-scuro);
  }
  #mytc .mytc-badge svg { width: 14px; height: 14px; }
  #mytc .mytc-apri .mytc-saluta { animation: mytc-saluta 2.4s ease-in-out 1.2s 2; transform-origin: 50% 90%; }
  @keyframes mytc-saluta { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-4deg); } }

  /* Fumetto "Chiedimi..." accanto al bottone */
  #mytc .mytc-fumetto {
    position: fixed;
    right: 90px;
    bottom: calc(26px + env(safe-area-inset-bottom));
    z-index: 9000;
    max-width: 210px;
    padding: 9px 12px;
    border-radius: 14px 14px 4px 14px;
    background: #fff;
    color: var(--mytc-blu);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    box-shadow: 0 6px 18px rgba(16, 27, 87, .18);
    cursor: pointer;
    animation: mytc-entra .35s ease both;
  }
  #mytc .mytc-fumetto[hidden] { display: none; }

  /* ---------- Finestra della chat ---------- */
  #mytc .mytc-finestra {
    position: fixed;
    right: 16px;
    bottom: calc(92px + env(safe-area-inset-bottom));
    z-index: 9001;
    display: flex;
    flex-direction: column;
    width: 380px;
    height: min(620px, calc(100vh - 120px));
    height: min(620px, calc(100dvh - 120px));
    overflow: hidden;
    border-radius: 20px;
    background: #f4f6fb;
    box-shadow: 0 18px 50px rgba(16, 27, 87, .32);
    animation: mytc-entra .25s ease both;
  }
  #mytc .mytc-finestra[hidden] { display: none; }
  @keyframes mytc-entra { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }

  @media (max-width: 520px) {
    #mytc .mytc-finestra {
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    #mytc.aperta .mytc-apri, #mytc.aperta .mytc-fumetto { display: none; }
  }

  #mytc .mytc-testa {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px 12px 14px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: linear-gradient(180deg, var(--mytc-blu) 0%, var(--mytc-blu-scuro) 100%);
    border-bottom: 4px solid var(--mytc-oro);
    color: #fff;
  }
  #mytc .mytc-testa svg { flex: none; width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 2px var(--mytc-oro-vivo); }
  #mytc .mytc-nome { margin: 0; font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-size: 22px; font-weight: 700; line-height: 1; }
  #mytc .mytc-nome span { color: var(--mytc-oro-vivo); }
  #mytc .mytc-stato { margin: 3px 0 0; font-size: 13px; opacity: .85; }
  #mytc .mytc-stato::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #4ade80; vertical-align: 1px; }
  #mytc .mytc-chiudi {
    margin-left: auto;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .12);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  #mytc .mytc-chiudi:hover { background: rgba(255, 255, 255, .22); }

  #mytc .mytc-messaggi {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px 6px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  #mytc .mytc-riga { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-end; }
  #mytc .mytc-riga.io { justify-content: flex-end; }
  #mytc .mytc-riga > svg { flex: none; width: 28px; height: 28px; border-radius: 50%; }
  #mytc .mytc-bolla {
    max-width: 85%;
    padding: 9px 12px;
    border-radius: 16px 16px 16px 4px;
    background: #fff;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-line;
    overflow-wrap: anywhere;
    box-shadow: 0 1px 2px rgba(26, 42, 124, .06);
  }
  #mytc .io .mytc-bolla { border-radius: 16px 16px 4px 16px; background: var(--mytc-blu); color: #fff; }
  #mytc .mytc-contenuto { display: flex; flex-direction: column; gap: 6px; max-width: 85%; min-width: 0; }
  #mytc .mytc-contenuto .mytc-bolla { max-width: 100%; }

  /* Schede: partite, allenamenti, risultati, persone */
  #mytc .mytc-scheda {
    display: flex;
    gap: 10px;
    padding: 9px 10px;
    border: 1px solid var(--mytc-linea);
    border-left: 4px solid var(--mytc-blu);
    border-radius: 12px;
    background: #fff;
    font-size: 14px;
    line-height: 1.3;
  }
  #mytc .mytc-scheda.partita { border-left-color: var(--mytc-oro); }
  #mytc .mytc-scheda.vinta { border-left-color: var(--mytc-verde); }
  #mytc .mytc-scheda.persa { border-left-color: var(--mytc-rosso); }
  #mytc .mytc-ico { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--mytc-blu-chiaro); font-size: 16px; }
  #mytc .partita .mytc-ico { background: var(--mytc-oro-chiaro); }
  #mytc .vinta .mytc-ico { background: var(--mytc-verde-chiaro); }
  #mytc .persa .mytc-ico { background: var(--mytc-rosso-chiaro); }
  #mytc .mytc-s-testo { min-width: 0; }
  #mytc .mytc-s-alto { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-bottom: 2px; }
  #mytc .mytc-squadra { padding: 1px 7px; border-radius: 999px; background: var(--mytc-blu); color: #fff; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  #mytc .mytc-etichetta { padding: 1px 7px; border-radius: 999px; background: var(--mytc-oro-chiaro); color: #7d5410; font-size: 11.5px; font-weight: 600; }
  #mytc .mytc-s-titolo { font-weight: 700; color: var(--mytc-testo); }
  #mytc .vinta .mytc-s-titolo { color: var(--mytc-verde); }
  #mytc .persa .mytc-s-titolo { color: var(--mytc-rosso); }
  #mytc .mytc-s-quando { color: var(--mytc-blu); font-weight: 600; }
  #mytc .mytc-s-luogo { color: var(--mytc-testo-2); font-size: 13px; }

  /* Classifica */
  #mytc .mytc-tabella { overflow: hidden; border: 1px solid var(--mytc-linea); border-radius: 12px; background: #fff; font-size: 13.5px; }
  #mytc .mytc-tabella-titolo { padding: 7px 10px; background: var(--mytc-blu-chiaro); color: var(--mytc-blu); font-weight: 700; font-size: 13px; }
  #mytc .mytc-tabella table { width: 100%; border-collapse: collapse; }
  #mytc .mytc-tabella td { padding: 5px 8px; border-top: 1px solid var(--mytc-linea); }
  #mytc .mytc-tabella td:first-child { width: 28px; text-align: center; color: var(--mytc-testo-2); font-weight: 600; }
  #mytc .mytc-tabella td:last-child { width: 40px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  #mytc .mytc-tabella tr.noi td { background: var(--mytc-oro-chiaro); color: #7d5410; font-weight: 700; }

  /* Elenco nomi (rosa) */
  #mytc .mytc-nomi { padding: 9px 10px; border: 1px solid var(--mytc-linea); border-radius: 12px; background: #fff; }
  #mytc .mytc-nomi strong { display: block; margin-bottom: 6px; color: var(--mytc-blu); font-size: 13px; }
  #mytc .mytc-nomi ul { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; padding: 0; list-style: none; }
  #mytc .mytc-nomi li { padding: 3px 9px; border-radius: 999px; background: var(--mytc-blu-chiaro); color: var(--mytc-blu); font-size: 13px; }

  #mytc .mytc-link {
    align-self: flex-start;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--mytc-blu);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }

  /* Suggerimenti */
  #mytc .mytc-sugg { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 12px 36px; }
  #mytc .mytc-sugg button {
    padding: 6px 11px;
    border: 1.5px solid var(--mytc-oro);
    border-radius: 999px;
    background: #fff;
    color: #7d5410;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #mytc .mytc-sugg button:hover { background: var(--mytc-oro-chiaro); }

  /* "MyT sta scrivendo" */
  #mytc .mytc-scrive { display: inline-flex; gap: 4px; padding: 12px 14px; }
  #mytc .mytc-scrive i { width: 7px; height: 7px; border-radius: 50%; background: var(--mytc-blu); opacity: .35; animation: mytc-punto 1s infinite; }
  #mytc .mytc-scrive i:nth-child(2) { animation-delay: .15s; }
  #mytc .mytc-scrive i:nth-child(3) { animation-delay: .3s; }
  @keyframes mytc-punto { 0%, 100% { opacity: .35; transform: none; } 50% { opacity: 1; transform: translateY(-3px); } }

  /* Riga per scrivere */
  #mytc .mytc-scrivi {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--mytc-linea);
    background: #fff;
  }
  #mytc .mytc-scrivi input {
    flex: 1;
    min-width: 0;
    height: 44px;
    padding: 0 14px;
    border: 1.5px solid var(--mytc-linea);
    border-radius: 999px;
    background: #f4f6fb;
    color: var(--mytc-testo);
    font: inherit;
    font-size: 16px; /* 16px: niente zoom su iPhone */
    outline: none;
  }
  #mytc .mytc-scrivi input:focus { border-color: var(--mytc-blu); background: #fff; }
  #mytc .mytc-scrivi button {
    flex: none;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: var(--mytc-oro);
    color: #fff;
    cursor: pointer;
  }
  #mytc .mytc-scrivi button:disabled { opacity: .5; cursor: default; }
  #mytc .mytc-scrivi button svg { width: 20px; height: 20px; vertical-align: middle; }
  /* ---------- Voce ---------- */
  #mytc .mytc-voce {
    margin-left: auto;
    height: 36px;
    padding: 0 12px;
    border: 1.5px solid rgba(255, 255, 255, .35);
    border-radius: 999px;
    background: transparent;
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  #mytc .mytc-voce[aria-pressed="true"] { background: var(--mytc-oro); border-color: var(--mytc-oro); }
  #mytc .mytc-voce + .mytc-chiudi { margin-left: 8px; }
  /* Microfono grande: si capisce subito che si può parlare */
  #mytc .mytc-parla {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 12px 6px;
    border-top: 1px solid var(--mytc-linea);
    background: #fff;
  }
  #mytc .mytc-mic {
    width: 68px;
    height: 68px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--mytc-oro-vivo), var(--mytc-oro));
    color: var(--mytc-blu-scuro);
    box-shadow: 0 6px 16px rgba(211, 155, 54, .45);
    cursor: pointer;
    animation: mytc-invita 2.4s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  #mytc .mytc-mic svg { width: 32px; height: 32px; vertical-align: middle; }
  #mytc .mytc-mic:focus-visible { outline: 3px solid var(--mytc-blu); outline-offset: 3px; }
  #mytc .mytc-mic.ascolta { background: #e5484d; color: #fff; animation: mytc-pulsa 1.1s ease-in-out infinite; }
  #mytc .mytc-parla-testo { color: var(--mytc-blu); font-size: 14px; font-weight: 700; }
  #mytc .mytc-parla + .mytc-scrivi { border-top: 0; padding-top: 4px; }
  @keyframes mytc-invita { 0%, 100% { box-shadow: 0 6px 16px rgba(211, 155, 54, .45), 0 0 0 0 rgba(211, 155, 54, .35); } 50% { box-shadow: 0 6px 16px rgba(211, 155, 54, .45), 0 0 0 10px rgba(211, 155, 54, 0); } }
  @keyframes mytc-pulsa { 0%, 100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, .5); } 50% { box-shadow: 0 0 0 14px rgba(229, 72, 77, 0); } }
  @media (prefers-reduced-motion: reduce) { #mytc .mytc-mic { animation: none; } }
  #mytc.sola .mytc-apri, #mytc.sola .mytc-fumetto { display: none; }
  #mytc.sola .mytc-finestra { inset: 0; width: 100%; max-width: 720px; height: 100%; margin: 0 auto; border-radius: 0; }
  #mytc .mytc-stato.carica::before { background: var(--mytc-oro-vivo); }
</style>

<div id="mytc">
  <div class="mytc-fumetto" id="mytcFumetto" hidden>Ciao! Sono MyT 🏐 Parlami o scrivimi: ti dico quando gioca la tua squadra!</div>

  <button type="button" class="mytc-apri" id="mytcApri" aria-label="Apri la chat con MyT" aria-expanded="false">
    <svg class="mytc-saluta" aria-hidden="true"><use href="#mytc-giocatrice"/></svg>
    <span class="mytc-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
  </button>

  <section class="mytc-finestra" id="mytcFinestra" role="dialog" aria-label="Chat con MyT" hidden>
    <header class="mytc-testa">
      <svg aria-hidden="true"><use href="#mytc-giocatrice"/></svg>
      <div>
        <p class="mytc-nome">My<span>T</span></p>
        <p class="mytc-stato" id="mytcStato">La giocatrice virtuale del Team Volley C8</p>
      </div>
      <button type="button" class="mytc-voce" id="mytcVoce" aria-pressed="false" title="MyT legge le risposte ad alta voce">🔈 Voce</button>
      <button type="button" class="mytc-chiudi" id="mytcChiudi" aria-label="Chiudi la chat">×</button>
    </header>

    <div class="mytc-messaggi" id="mytcMessaggi" aria-live="polite"></div>

    <div class="mytc-parla">
      <button type="button" class="mytc-mic" id="mytcMic" aria-label="Parla con MyT">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <span class="mytc-parla-testo" id="mytcMicTesto">Tocca e parla con MyT</span>
    </div>

    <form class="mytc-scrivi" id="mytcForm" autocomplete="off">
      <input type="text" id="mytcTesto" maxlength="300" placeholder="…oppure scrivi qui" aria-label="Scrivi la domanda">
      <button type="submit" id="mytcInvia" aria-label="Invia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
</div>

<script>
/* Il "cervello" di MyT: è lo stesso codice di ChatBot.gs, qui gira
   direttamente sul telefono così le risposte sono immediate. */
var MYTC_D = null;   // dati caricati da datiChatMyT()

function mytcBase_() { return MYTC_D.base; }
function mytcEventi_() { return MYTC_D.eventi; }
function mytcRisultatiTutti_() { return JSON.parse(JSON.stringify(MYTC_D.risultati || [])); }
function mytcClassificheTutte_() {
  if (MYTC_D.classificheErrore && !(MYTC_D.classifiche || []).length) throw new Error(MYTC_D.classificheErrore);
  return JSON.parse(JSON.stringify(MYTC_D.classifiche || []));
}
function mytcOraRoma_() {
  var p = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date()).forEach(function(x) { p[x.type] = x.value; });
  return p.year + '-' + p.month + '-' + p.day + 'T' + (p.hour === '24' ? '00' : p.hour) + ':' + p.minute;
}
function mytcOggi_() { return mytcOraRoma_().slice(0, 10); }
function mytcAdesso_() { return mytcOraRoma_(); }

// ===================== CERVELLO INIZIO =====================
// (uguale in ChatBot.gs e in ChatMyT.html)

const MYTC = {
  GIORNI_AVANTI: 120,      // quanto avanti si guarda nel calendario
  NOSTRA_SQUADRA: /team\s*volley|teamvolley|\bc\s*8\b/i,

  // Nomi ufficiali delle squadre (come nel foglio Squadre)
  SQUADRE: ['2° Div. F.', '3° Div. F', 'U17 C.S.I.', 'U14 F.', 'U14 C.S.I.', 'U12 C.S.I.', 'Super Volley', 'MiniVolley'],
  FIPAV: ['2° Div. F.', '3° Div. F', 'U14 F.'],
  CSI: ['U17 C.S.I.', 'U14 C.S.I.', 'U12 C.S.I.']
};

// ------------------------------------------------------------
// Il "cervello": capisce la domanda e sceglie la risposta
// ------------------------------------------------------------

function mytcRispondi_(domanda) {
  const s = mytcNorm_(domanda);
  if (!s.trim()) return mytcAiuto_('');

  const oggi = mytcOggi_();
  const squadre = mytcSquadreNelTesto_(s);
  const periodo = mytcPeriodo_(s, oggi);
  const parole = s.trim().split(' ');

  const vuole = {
    grazie: /\b(grazie|grz|thanks|ottimo|perfetto|bravissima|brava)\b/.test(s),
    saluto: /^ *(ciao|salve|buongiorno|buonasera|hey|ehi|hello|hola)\b/.test(s),
    aiuto: /\b(aiuto|help|cosa sai|che cosa sai|cosa puoi|come funzioni|chi sei|cosa fai)\b/.test(s),
    classifica: /\b(classific\w*|posizion\w*|in testa|primi|prime)\b/.test(s),
    risultato: /\b(risultat\w*|andat\w|finit\w|vint\w|pers[oaei]|punteggio|ultima partita|ultime partite|com e andata|score)\b/.test(s),
    staff: /\b(allenator\w*|allenatric\w*|coach|mister|staff|chi allena|dirigent\w*|vice)\b/.test(s),
    rosa: /\b(rosa|atlete|atleti|giocatrici|giocatori|ragazze|ragazzi|bambine|bambini|composta|componenti|iscritt\w*|elenco)\b/.test(s),
    allenamento: /\b(allena|allenano|allenamento|allenamenti|allenarsi|allenamen\w*)\b/.test(s),
    partita: /\b(partit\w*|gioca|giocano|giochiamo|gara|gare|match|sfida|contro|trasferta|trasferte|casa|avversari\w*|calendario|torneo)\b/.test(s),
    squadre: /\b(quali|che|quante|tutte le) squadre\b|^ *squadre *$/.test(s),
    chi: /\bchi\b/.test(s)
  };

  // Saluti e ringraziamenti brevi
  if (vuole.grazie && parole.length <= 4) {
    return { testo: 'Di niente! 💙💛 Forza Team Volley C8!', suggerimenti: ['Prossime partite', 'Risultati'] };
  }
  if ((vuole.saluto && parole.length <= 3) || vuole.aiuto) return mytcAiuto_(vuole.saluto ? 'Ciao! ' : '');

  // Nomi di persone scritti nella domanda
  const base = mytcBase_();
  const persone = mytcPersoneNelTesto_(s, base, squadre.length > 0);

  const tempoOTipo = periodo || vuole.partita || vuole.allenamento || vuole.risultato || vuole.classifica;

  if (persone.length) {
    // "quando gioca Anna Beltramolli?" -> le partite delle sue squadre
    const squadreDiChi = mytcUnici_([].concat.apply([], persone.map(function(p) { return p.squadre; })));
    if (tempoOTipo && persone.length === 1 && squadreDiChi.length) {
      const r = mytcProgramma_(squadreDiChi, periodo, vuole, s, oggi);
      r.testo = mytcPunto_(persone[0].nome + ' gioca in ' + mytcElenco_(squadreDiChi)) + '\n' + r.testo;
      return r;
    }
    if (!squadre.length || vuole.chi) return mytcRispostaPersone_(persone);
  }

  if (vuole.squadre && !squadre.length) return mytcElencoSquadre_(base);
  if (vuole.classifica) return mytcClassifica_(squadre);
  if (vuole.risultato && !periodo) return mytcRisultati_(squadre);
  if (vuole.staff && squadre.length) return mytcStaff_(squadre, base);
  const chiGioca = vuole.chi && !periodo && !vuole.allenamento && !/\b(quando|contro|partit\w*|gara|gare|dove)\b/.test(s);
  if (squadre.length && (vuole.rosa || chiGioca)) {
    return mytcRosa_(squadre, base);
  }

  // Ruoli in società: "chi è il presidente", "chi fa il segnapunti"...
  if (!squadre.length && (vuole.chi || vuole.staff) && !periodo) {
    const ruoli = mytcCercaRuolo_(s, base);
    if (ruoli) return ruoli;
  }

  if (squadre.length || periodo || vuole.partita || vuole.allenamento) {
    return mytcProgramma_(squadre, periodo, vuole, s, oggi);
  }

  // Non capito: forse c'è un ruolo
  const ruoli = mytcCercaRuolo_(s, base);
  if (ruoli) return ruoli;

  return mytcAiuto_('Non sono sicura di aver capito 🤔 ');
}


// ------------------------------------------------------------
// Risposte
// ------------------------------------------------------------

function mytcAiuto_(inizio) {
  return {
    testo: inizio + 'Sono MyT, la giocatrice virtuale del Team Volley C8 🏐\n' +
      'Chiedimi di partite, allenamenti, risultati, classifiche, atlete e staff delle squadre. Per esempio:',
    suggerimenti: ['Quando gioca la U14?', 'Allenamenti di oggi', 'Partite del weekend',
      'Risultati', 'Classifica 2 Div', 'Chi allena la Super Volley?']
  };
}

/** Partite e/o allenamenti, dal calendario MyT-Agenda. */
function mytcProgramma_(squadre, periodo, vuole, s, oggi) {
  let tipo = '';
  if (vuole.partita && !vuole.allenamento) tipo = 'partita';
  if (vuole.allenamento && !vuole.partita) tipo = 'allenamento';
  // "quando si allena" contiene anche "gioca"? no; "gioca" + "allenamento" -> tutti e due

  const soloCasa = /\bin casa\b/.test(s) && !/trasfert/.test(s);
  const soloTrasferta = /trasfert/.test(s) && !/\bin casa\b/.test(s);
  const plurale = /\b(prossime|partite|tutte|calendario|gare)\b/.test(s);

  let da = oggi;
  let a = mytcPiuGiorni_(oggi, MYTC.GIORNI_AVANTI);
  if (periodo) { da = periodo.da; a = periodo.a; }

  let eventi = mytcEventi_().filter(function(e) {
    if (e.data < da || e.data > a) return false;
    if (e.data === oggi && e.fineIso && e.fineIso < mytcAdesso_() && !periodo) return false; // già finito
    if (squadre.length && squadre.indexOf(e.squadra) === -1) return false;
    if (tipo && e.tipo !== tipo) return false;
    if (soloCasa && e.casa !== true) return false;
    if (soloTrasferta && e.casa !== false) return false;
    return true;
  });

  const chi = squadre.length ? mytcElenco_(squadre) : '';
  let testo = '';
  let scelti = [];

  if (periodo) {
    scelti = eventi.slice(0, 25);
    const cosa = tipo === 'partita' ? 'partite' : tipo === 'allenamento' ? 'allenamenti' : 'impegni';
    testo = scelti.length
      ? mytcMaiuscola_(periodo.etichetta) + (chi ? ', ' + chi : '') + ': ' + mytcConta_(scelti, tipo) + '.'
      : 'Nessun ' + (tipo === 'partita' ? 'impegno di partita' : tipo === 'allenamento' ? 'allenamento' : 'impegno') +
        (chi ? ' per ' + chi : '') + ' ' + periodo.etichetta + ' nel calendario.';
    if (!scelti.length && cosa) {
      // suggerisco il prossimo dopo il periodo
      const dopo = mytcEventi_().filter(function(e) {
        return e.data > a && (!squadre.length || squadre.indexOf(e.squadra) !== -1) && (!tipo || e.tipo === tipo);
      })[0];
      if (dopo) {
        testo += '\nIl prossimo è ' + mytcGiornoLungo_(dopo.data, oggi) + ':';
        scelti = [dopo];
      }
    }
  } else if (tipo === 'allenamento') {
    if (squadre.length) {
      // gli allenamenti dei prossimi 7 giorni
      const fine = mytcPiuGiorni_(oggi, 6);
      scelti = eventi.filter(function(e) { return e.data <= fine; });
      if (!scelti.length) scelti = eventi.slice(0, 3);
      testo = scelti.length
        ? 'Ecco gli allenamenti di ' + chi + (scelti[scelti.length - 1].data <= fine ? ' dei prossimi 7 giorni' : '') + ':'
        : 'Non trovo allenamenti in calendario per ' + chi + '.';
    } else {
      // tutte le squadre: oggi, se no il primo giorno con allenamenti
      const primo = eventi[0];
      scelti = primo ? eventi.filter(function(e) { return e.data === primo.data; }) : [];
      testo = primo
        ? 'Allenamenti di ' + mytcGiornoLungo_(primo.data, oggi) + ':'
        : 'Non trovo allenamenti in calendario.';
    }
  } else if (tipo === 'partita') {
    if (squadre.length) {
      const quante = plurale ? 4 : 1;
      squadre.forEach(function(sq) {
        scelti = scelti.concat(eventi.filter(function(e) { return e.squadra === sq; }).slice(0, quante));
      });
      scelti.sort(mytcOrdina_);
      testo = scelti.length
        ? (scelti.length === 1 ? 'La prossima partita di ' + chi + ':' : 'Le prossime partite di ' + chi + ':')
        : 'Non trovo partite in calendario per ' + chi + ' nei prossimi mesi.';
    } else {
      // tutte le squadre: le partite dei prossimi 7 giorni (almeno 4)
      const fine = mytcPiuGiorni_(oggi, 7);
      scelti = eventi.filter(function(e) { return e.data <= fine; });
      if (scelti.length < 4) scelti = eventi.slice(0, 4);
      testo = scelti.length ? 'Le prossime partite del Team Volley C8:' : 'Non trovo partite in calendario.';
    }
  } else {
    // Solo la squadra: prossima partita + allenamenti della settimana
    const fine = mytcPiuGiorni_(oggi, 6);
    squadre.forEach(function(sq) {
      const suoi = eventi.filter(function(e) { return e.squadra === sq; });
      const partita = suoi.filter(function(e) { return e.tipo === 'partita'; })[0];
      const allenamenti = suoi.filter(function(e) { return e.tipo === 'allenamento' && e.data <= fine; });
      if (partita) scelti.push(partita);
      scelti = scelti.concat(allenamenti);
    });
    scelti = mytcUniciEventi_(scelti).sort(mytcOrdina_);
    testo = scelti.length
      ? 'Ecco cosa c\'è per ' + chi + ': la prossima partita e gli allenamenti dei prossimi 7 giorni.'
      : 'Non trovo niente in calendario per ' + chi + '.';
  }

  const sugg = [];
  if (squadre.length === 1) {
    const n = mytcNomeBreve_(squadre[0]);
    if (tipo !== 'allenamento') sugg.push('Allenamenti ' + n);
    if (tipo !== 'partita') sugg.push('Prossime partite ' + n);
    if (MYTC.FIPAV.indexOf(squadre[0]) !== -1 || MYTC.CSI.indexOf(squadre[0]) !== -1) {
      sugg.push('Risultati ' + n, 'Classifica ' + n);
    } else {
      sugg.push('Chi gioca nella ' + n + '?');
    }
  } else {
    sugg.push('Partite del weekend', 'Risultati', 'Allenamenti di domani');
  }

  return {
    testo: testo,
    schede: scelti.map(function(e) { return mytcSchedaEvento_(e, oggi); }),
    link: { testo: 'Apri l\'Agenda', pagina: 'agenda' },
    suggerimenti: sugg
  };
}

function mytcConta_(eventi, tipo) {
  const p = eventi.filter(function(e) { return e.tipo === 'partita'; }).length;
  const al = eventi.filter(function(e) { return e.tipo === 'allenamento'; }).length;
  const altri = eventi.length - p - al;
  const pezzi = [];
  if (p) pezzi.push(p === 1 ? '1 partita' : p + ' partite');
  if (al) pezzi.push(al === 1 ? '1 allenamento' : al + ' allenamenti');
  if (altri) pezzi.push(altri === 1 ? '1 altro impegno' : altri + ' altri impegni');
  return pezzi.join(' e ');
}

function mytcSchedaEvento_(e, oggi) {
  let titolo = e.tipo === 'allenamento' ? 'Allenamento' : e.tipo === 'partita' ? 'Partita' : e.titolo;
  if (e.tipo === 'partita' && e.avversaria) titolo = 'vs ' + e.avversaria;
  return {
    tipo: e.tipo,
    squadra: e.squadra,
    titolo: titolo,
    quando: mytcGiornoBreve_(e.data, oggi) + (e.ora ? ' · ' + e.ora + (e.oraFine ? '–' + e.oraFine : '') : ''),
    luogo: e.luogo,
    etichetta: e.tipo === 'partita' ? (e.casa === true ? 'In casa' : e.casa === false ? 'Trasferta' : '') : '',
    voce: mytcDataParlata_(e.data, oggi) + (e.ora ? ' alle ' + e.ora.replace(/^0/, '') : '') + ', ' +
      mytcSquadraParlata_(e.squadra) + ', ' +
      (e.tipo === 'partita'
        ? (e.avversaria ? 'contro ' + e.avversaria : 'partita') +
          (e.casa === true ? ', in casa' : e.casa === false ? ', in trasferta' : '')
        : e.tipo === 'allenamento' ? 'allenamento' : e.titolo)
  };
}

/** Ultimi risultati (FIPAV + CSI). */
function mytcRisultati_(squadre) {
  let partite = mytcRisultatiTutti_();

  partite = partite.filter(function(p) {
    return p.risultato && p.stato !== 'da giocare' && p.stato !== 'da inserire';
  }).map(function(p) {
    p.squadraNorm = mytcSquadraDaTesto_(p.squadra) || p.squadra;
    return p;
  });

  if (squadre.length) {
    partite = partite.filter(function(p) { return squadre.indexOf(p.squadraNorm) !== -1; });
  }
  partite.sort(function(a, b) { return a.quando < b.quando ? 1 : a.quando > b.quando ? -1 : 0; });

  let scelte;
  if (squadre.length) {
    scelte = [];
    squadre.forEach(function(sq) {
      scelte = scelte.concat(partite.filter(function(p) { return p.squadraNorm === sq; }).slice(0, 3));
    });
  } else {
    // l'ultima di ogni squadra, solo se delle ultime 3 settimane
    const limite = mytcPiuGiorni_(mytcOggi_(), -21);
    const viste = {};
    scelte = partite.filter(function(p) {
      if (viste[p.squadraNorm] || p.quando.slice(0, 10) < limite) return false;
      viste[p.squadraNorm] = true;
      return true;
    });
  }
  scelte.sort(function(a, b) { return a.quando < b.quando ? 1 : -1; });

  const chi = squadre.length ? mytcElenco_(squadre) : '';
  const oggi = mytcOggi_();
  const schede = scelte.map(function(p) {
    const set = String(p.risultato).split('-').map(Number);
    const vinta = p.noiInCasa ? set[0] > set[1] : set[1] > set[0];
    const noi = p.noiInCasa ? set[0] : set[1];
    const loro = p.noiInCasa ? set[1] : set[0];
    const avversaria = p.noiInCasa ? p.ospite : p.casa;
    return {
      tipo: vinta ? 'vinta' : 'persa',
      squadra: p.squadraNorm,
      titolo: (vinta ? 'Vinta ' : 'Persa ') + noi + '-' + loro + ' vs ' + mytcPulisci_(avversaria),
      quando: mytcGiornoBreve_(p.quando.slice(0, 10), oggi) + (p.noiInCasa ? ' · in casa' : ' · in trasferta'),
      luogo: (p.set && p.set.length) ? 'Set: ' + p.set.join(' · ') : '',
      etichetta: p.stato === 'non ufficiale' ? 'Non ufficiale' : '',
      voce: mytcSquadraParlata_(p.squadraNorm) + ', ' + (vinta ? 'vinta ' : 'persa ') + noi + ' a ' + loro +
        ' contro ' + mytcPulisci_(avversaria) + ', ' + mytcDataParlata_(p.quando.slice(0, 10), oggi)
    };
  });

  let testo;
  if (!schede.length) {
    testo = chi
      ? 'Non trovo risultati recenti per ' + chi + '. I risultati FIPAV arrivano dal sito, quelli CSI dal foglio.'
      : 'Non trovo risultati nelle ultime settimane.';
  } else {
    const vinte = schede.filter(function(x) { return x.tipo === 'vinta'; }).length;
    testo = (chi ? 'Gli ultimi risultati di ' + chi + ':' : 'Gli ultimi risultati delle nostre squadre:') +
      (vinte === schede.length && schede.length > 1 ? ' tutte vinte! 🎉' : '');
  }
  return {
    testo: testo,
    schede: schede,
    link: { testo: 'Apri Squadre', pagina: 'squadre' },
    suggerimenti: squadre.length === 1
      ? ['Classifica ' + mytcNomeBreve_(squadre[0]), 'Prossime partite ' + mytcNomeBreve_(squadre[0])]
      : ['Classifiche', 'Prossime partite']
  };
}

/** Classifiche FIPAV e CSI. */
function mytcClassifica_(squadre) {
  let tutte = [];
  try { tutte = mytcClassificheTutte_(); } catch (e) {
    return { testo: 'In questo momento non riesco a leggere le classifiche 😕 Riprova più tardi.' };
  }
  tutte.forEach(function(c) { c.squadraNorm = mytcSquadraDaTesto_(c.squadra) || c.squadra; });

  // Una sola classifica per squadra (la prima è la fase più recente)
  const perSquadra = {};
  tutte.forEach(function(c) { if (!perSquadra[c.squadraNorm]) perSquadra[c.squadraNorm] = c; });

  const frase = function(c) {
    const noi = (c.righe || []).filter(function(r) { return r.noi; })[0];
    if (!noi) return c.squadraNorm + ': non trovo il Team Volley C8 in classifica.';
    return c.squadraNorm + ': ' + noi.pos + 'ª su ' + c.righe.length + ' con ' + noi.punti +
      (noi.punti === 1 ? ' punto' : ' punti') + (noi.giocate != null ? ' (' + noi.giocate + ' giocate)' : '') +
      (noi.pos === 1 ? ' 🥇' : '');
  };

  if (squadre.length === 1) {
    const c = perSquadra[squadre[0]];
    if (!c) {
      return {
        testo: 'Non ho la classifica di ' + squadre[0] + '.' +
          (MYTC.CSI.indexOf(squadre[0]) !== -1 ? ' Le classifiche CSI vengono inserite a mano: forse non è ancora stata caricata.' : ''),
        suggerimenti: ['Classifiche']
      };
    }
    return {
      testo: frase(c),
      tabella: {
        titolo: c.campionato || c.squadraNorm,
        righe: c.righe.slice(0, 16).map(function(r) {
          return { pos: r.pos, nome: mytcPulisci_(r.squadra), punti: r.punti, giocate: r.giocate, noi: !!r.noi };
        })
      },
      link: { testo: 'Apri Squadre', pagina: 'squadre' },
      suggerimenti: ['Risultati ' + mytcNomeBreve_(squadre[0]), 'Prossime partite ' + mytcNomeBreve_(squadre[0])]
    };
  }

  const elenco = (squadre.length ? squadre : Object.keys(perSquadra))
    .filter(function(sq) { return perSquadra[sq]; });
  return {
    testo: elenco.length
      ? 'Dove siamo in classifica:\n' + elenco.map(function(sq) { return '• ' + frase(perSquadra[sq]); }).join('\n')
      : 'Non trovo classifiche in questo momento.',
    link: { testo: 'Apri Squadre', pagina: 'squadre' },
    suggerimenti: elenco.slice(0, 3).map(function(sq) { return 'Classifica ' + mytcNomeBreve_(sq); })
  };
}

/** Rosa di una squadra (solo nome e cognome). */
function mytcRosa_(squadre, base) {
  const testi = [];
  const nomi = [];
  squadre.forEach(function(sq) {
    const atlete = base.atlete.filter(function(a) { return a.squadre.indexOf(sq) !== -1; })
      .map(function(a) { return a.nome; })
      .sort(function(x, y) { return x.localeCompare(y, 'it'); });
    if (!atlete.length) {
      testi.push('Per ' + sq + ' non ci sono ancora atlete nell\'elenco.');
      return;
    }
    testi.push(sq + ': ' + atlete.length + (atlete.length === 1 ? ' atleta' : ' atlete') + '.');
    nomi.push({ titolo: sq, nomi: atlete });
  });
  return {
    testo: testi.join('\n'),
    nomi: nomi,
    link: { testo: 'Apri Squadre', pagina: 'squadre' },
    suggerimenti: squadre.length === 1
      ? ['Chi allena la ' + mytcNomeBreve_(squadre[0]) + '?', 'Prossime partite ' + mytcNomeBreve_(squadre[0])]
      : ['Squadre']
  };
}

/** Staff di una squadra (Staff Squadre + dirigenti da Persone). */
function mytcStaff_(squadre, base) {
  const righe = [];
  squadre.forEach(function(sq) {
    const visti = {};
    const membri = base.staff.filter(function(x) { return x.squadre.indexOf(sq) !== -1; });
    base.ruoli.forEach(function(r) {
      if (/dirigente/i.test(r.mansione) && mytcSquadreNelTesto_(mytcNorm_(r.mansione)).indexOf(sq) !== -1) {
        membri.push({ nome: r.nome, ruolo: r.mansione });
      }
    });
    const pezzi = [];
    membri.forEach(function(m) {
      const k = m.nome + '|' + m.ruolo;
      if (visti[k] || /posizione aperta|^\.+$/i.test(m.nome)) return;
      visti[k] = true;
      pezzi.push(m.nome + ' (' + m.ruolo + ')');
    });
    righe.push(pezzi.length ? '• ' + sq + ': ' + pezzi.join(', ') : '• ' + sq + ': staff non ancora indicato.');
  });
  return {
    testo: 'Lo staff:\n' + righe.join('\n'),
    link: { testo: 'Apri Squadre', pagina: 'squadre' },
    suggerimenti: squadre.length === 1 ? ['Chi gioca nella ' + mytcNomeBreve_(squadre[0]) + '?'] : []
  };
}

/** Elenco squadre con il numero di atlete. */
function mytcElencoSquadre_(base) {
  return {
    testo: 'Le squadre del Team Volley C8:\n' + MYTC.SQUADRE.map(function(sq) {
      const n = base.atlete.filter(function(a) { return a.squadre.indexOf(sq) !== -1; }).length;
      return '• ' + sq + (n ? ' (' + n + ')' : '');
    }).join('\n'),
    link: { testo: 'Apri Squadre', pagina: 'squadre' },
    suggerimenti: ['Chi gioca nella U14?', 'Quando gioca la 2 Div?']
  };
}

/** Una o più persone trovate per nome. */
function mytcRispostaPersone_(persone) {
  if (persone.length > 12) {
    return {
      testo: 'Ho trovato ' + persone.length + ' persone con quel nome 😊 Scrivimi anche il cognome.',
      nomi: [{ titolo: 'Trovate', nomi: persone.slice(0, 30).map(function(p) { return p.nome; }) }]
    };
  }
  const schede = persone.map(function(p) {
    const righe = [];
    if (p.squadre.length) righe.push('Gioca in ' + mytcElenco_(p.squadre));
    if (p.ruoli.length) righe.push(mytcUnici_(p.ruoli).join(' · '));
    return { tipo: 'persona', titolo: p.nome, quando: righe[0] || '', luogo: righe.slice(1).join(' · '),
      voce: p.nome + (righe.length ? ': ' + righe.join(', ') : '') };
  });
  let testo;
  if (persone.length === 1) {
    const p = persone[0];
    testo = p.squadre.length
      ? mytcPunto_(p.nome + ' gioca ' + (p.squadre.length === 1 ? 'nella ' : 'in ') + mytcElenco_(p.squadre))
      : 'Ecco cosa so di ' + p.nome + ':';
  } else {
    testo = 'Ho trovato ' + persone.length + ' persone:';
  }
  const sq = persone.length === 1 && persone[0].squadre[0];
  return {
    testo: testo,
    schede: schede,
    suggerimenti: sq ? ['Prossime partite ' + mytcNomeBreve_(sq), 'Allenamenti ' + mytcNomeBreve_(sq)] : []
  };
}

/** "chi è il presidente?", "chi fa il segnapunti?" (pagina Persone). */
function mytcCercaRuolo_(s, base) {
  const inutili = ' chi e il lo la le gli i un una del della dei delle di da per che fa fanno sono si occupa occupano ' +
    'ci nel nella nelle team volley c8 societa squadra ora adesso mi dici dimmi sai quale quali cosa come ';
  const parole = s.split(' ').filter(function(w) { return w.length >= 4 && inutili.indexOf(' ' + w + ' ') === -1; });
  if (!parole.length) return null;
  const vice = /\bvice\b/.test(s);

  const trovati = [];
  base.ruoli.forEach(function(r) {
    if (/posizione aperta|^\.+$/i.test(r.nome)) return;
    const testo = mytcNorm_(r.categoria + ' ' + r.mansione);
    if (!vice && /\bvice\b/.test(testo)) return;
    const voci = testo.split(' ');
    let punti = 0;
    parole.forEach(function(w) {
      const radice = w.slice(0, Math.max(5, w.length - 2));
      if (voci.some(function(v) { return v.indexOf(radice) === 0; })) punti++;
    });
    if (punti) trovati.push({ r: r, punti: punti });
  });
  if (!trovati.length) return null;

  const meglio = Math.max.apply(null, trovati.map(function(t) { return t.punti; }));
  const perRuolo = {};
  const ordine = [];
  trovati.filter(function(t) { return t.punti === meglio; }).forEach(function(t) {
    const ruolo = t.r.mansione || t.r.categoria;
    if (!perRuolo[ruolo]) { perRuolo[ruolo] = []; ordine.push(ruolo); }
    if (perRuolo[ruolo].indexOf(t.r.nome) === -1) perRuolo[ruolo].push(t.r.nome);
  });

  return {
    testo: ordine.slice(0, 8).map(function(ruolo) {
      return '• ' + ruolo + ': ' + perRuolo[ruolo].join(', ');
    }).join('\n'),
    link: { testo: 'Apri Persone', pagina: 'persone' },
    suggerimenti: ['Chi c\'è nel Board?', 'Chi è il presidente?']
  };
}

// ------------------------------------------------------------
// Riconoscere squadre, persone e periodi nel testo
// ------------------------------------------------------------

/** Testo semplice: minuscolo, senza accenti, solo lettere/numeri, "c.s.i." -> csi, "under 14" -> u14. */
function mytcNorm_(t) {
  return ' ' + String(t || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .replace(/\bc s i\b/g, 'csi')
    .replace(/\bunder\s*(\d\d)\b/g, 'u$1')
    .replace(/\bu (\d\d)\b/g, 'u$1')
    .replace(/\b(\d)\s*(a|o|ª)\s+div/g, '$1 div')
    .replace(/\s+/g, ' ')
    .trim() + ' ';
}

/** Squadre nominate nella domanda (nomi ufficiali). */
function mytcSquadreNelTesto_(s) {
  const out = [];
  const add = function(x) { if (out.indexOf(x) === -1) out.push(x); };
  if (/\b(2|ii|seconda)\s*div|\b2div|\bseconda\b/.test(s)) add('2° Div. F.');
  if (/\b(3|iii|terza)\s*div|\b3div|\bterza\b/.test(s)) add('3° Div. F');
  if (/\bu14\s*(f|fipav|fed|federale)\b/.test(s)) add('U14 F.');
  else if (/\bu14\s*csi\b/.test(s)) add('U14 C.S.I.');
  else if (/\bu14\b/.test(s)) { add('U14 F.'); add('U14 C.S.I.'); }
  if (/\bu12\b/.test(s)) add('U12 C.S.I.');
  if (/\bu17\b/.test(s)) add('U17 C.S.I.');
  if (/\bsuper\s*volley\b|\bsupervolley\b|\bsuper\b/.test(s)) add('Super Volley');
  if (/\bmini\s*volley\b|\bminivolley\b|\bmini\b/.test(s)) add('MiniVolley');
  if (!out.length && /\bcsi\b/.test(s)) MYTC.CSI.forEach(add);
  if (!out.length && /\bfipav\b/.test(s)) MYTC.FIPAV.forEach(add);
  return out;
}

/** Un nome di squadra scritto in qualunque modo -> nome ufficiale ('' se non è una squadra). */
function mytcSquadraDaTesto_(t) {
  const k = String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!k) return '';
  if (/^(2|ii|seconda)div/.test(k)) return '2° Div. F.';
  if (/^(3|iii|terza)div/.test(k)) return '3° Div. F';
  if (/^(u|under)14csi/.test(k)) return 'U14 C.S.I.';
  if (/^(u|under)14/.test(k)) return 'U14 F.';
  if (/^(u|under)12/.test(k)) return 'U12 C.S.I.';
  if (/^(u|under)17/.test(k)) return 'U17 C.S.I.';
  if (/^supervolley/.test(k)) return 'Super Volley';
  if (/^minivolley/.test(k)) return 'MiniVolley';
  return '';
}

/** Persone (atlete, staff, Persone) il cui nome compare nella domanda. */
function mytcPersoneNelTesto_(s, base, ciSonoSquadre) {
  // Tutte le persone, unite per nome
  const tutte = {};
  const prendi = function(nome) {
    const chiave = mytcParoleNome_(nome).sort().join(' ');
    if (!chiave) return null;
    if (!tutte[chiave]) tutte[chiave] = { nome: nome, parole: mytcParoleNome_(nome), squadre: [], ruoli: [] };
    return tutte[chiave];
  };
  base.atlete.forEach(function(a) {
    const p = prendi(a.nome);
    if (p) { p.nome = a.nome; p.squadre = mytcUnici_(p.squadre.concat(a.squadre)); }
  });
  base.staff.forEach(function(x) {
    const p = prendi(x.nome);
    if (p) p.ruoli.push(x.ruolo + (x.squadre.length ? '' : ' (' + x.squadraTesto + ')'));
  });
  base.ruoli.forEach(function(r) {
    if (/posizione aperta|^\.+$/i.test(r.nome)) return;
    const p = prendi(r.nome);
    if (p) p.ruoli.push(r.mansione ? r.mansione : r.categoria);
  });

  const elenco = Object.keys(tutte).map(function(k) { return tutte[k]; });
  const conosciute = {};
  elenco.forEach(function(p) { p.parole.forEach(function(w) { conosciute[w] = true; }); });

  // Parole della domanda che sono nomi o cognomi
  const escluse = { rosa: ciSonoSquadre, volley: true, team: true, super: true, mini: true, casa: true };
  const cercate = mytcUnici_(s.trim().split(' ').filter(function(w) {
    return w.length >= 3 && conosciute[w] && !escluse[w];
  }));
  if (!cercate.length) return [];

  let trovate = elenco.filter(function(p) {
    return cercate.every(function(w) { return p.parole.indexOf(w) !== -1; });
  });
  if (!trovate.length) {
    // nome giusto e cognome sbagliato (o il contrario): chi ne ha di più
    const punti = elenco.map(function(p) {
      return cercate.filter(function(w) { return p.parole.indexOf(w) !== -1; }).length;
    });
    const max = Math.max.apply(null, punti);
    trovate = elenco.filter(function(p, i) { return punti[i] === max && max > 0; });
  }
  return trovate.sort(function(a, b) { return a.nome.localeCompare(b.nome, 'it'); });
}

function mytcParoleNome_(nome) {
  return mytcNorm_(nome).trim().split(' ').filter(function(w) { return w.length >= 3; });
}

/** oggi, domani, sabato, weekend, questa/prossima settimana, 28/11... -> {da, a, etichetta} */
function mytcPeriodo_(s, oggi) {
  const dow = mytcGiornoSettimana_(oggi); // 0 = domenica
  const giorni = ['domenica', 'lunedi', 'martedi', 'mercoledi', 'giovedi', 'venerdi', 'sabato'];

  if (/\b(oggi|stasera|stamattina|stamani|stanotte|oggigiorno)\b/.test(s)) return { da: oggi, a: oggi, etichetta: 'oggi' };
  if (/\bdopodomani\b/.test(s)) { const d = mytcPiuGiorni_(oggi, 2); return { da: d, a: d, etichetta: mytcGiornoLungo_(d, oggi) }; }
  if (/\bdomani\b/.test(s)) { const d = mytcPiuGiorni_(oggi, 1); return { da: d, a: d, etichetta: 'domani' }; }

  if (/\b(weekend|week end|fine settimana|finesettimana|sabato e domenica)\b/.test(s)) {
    const sab = dow === 0 ? mytcPiuGiorni_(oggi, -1) : mytcPiuGiorni_(oggi, 6 - dow);
    const dom = mytcPiuGiorni_(sab, 1);
    return { da: sab < oggi ? oggi : sab, a: dom, etichetta: 'nel weekend' };
  }
  if (/\b(prossima settimana|settimana prossima)\b/.test(s)) {
    const lun = mytcPiuGiorni_(oggi, dow === 0 ? 1 : 8 - dow);
    return { da: lun, a: mytcPiuGiorni_(lun, 6), etichetta: 'la prossima settimana' };
  }
  if (/\b(settimana|sett)\b/.test(s)) {
    return { da: oggi, a: mytcPiuGiorni_(oggi, dow === 0 ? 0 : 7 - dow), etichetta: 'questa settimana' };
  }
  if (/\b(prossimo mese|mese prossimo)\b/.test(s)) {
    const p = oggi.split('-').map(Number);
    const m = p[1] === 12 ? 1 : p[1] + 1;
    const y = p[1] === 12 ? p[0] + 1 : p[0];
    const da = y + '-' + mytcDue_(m) + '-01';
    return { da: da, a: y + '-' + mytcDue_(m) + '-' + mytcDue_(mytcGiorniMese_(y, m)), etichetta: 'il prossimo mese' };
  }
  if (/\b(questo mese|mese)\b/.test(s)) {
    const p = oggi.split('-').map(Number);
    return { da: oggi, a: p[0] + '-' + mytcDue_(p[1]) + '-' + mytcDue_(mytcGiorniMese_(p[0], p[1])), etichetta: 'questo mese' };
  }

  for (let i = 0; i < 7; i++) {
    const re = new RegExp('\\b' + giorni[i].slice(0, giorni[i] === 'domenica' ? 8 : 5) + '\\w*');
    if (re.test(s)) {
      let avanti = (i - dow + 7) % 7;
      if (avanti === 0 && /\bprossim[oa]\b/.test(s)) avanti = 7;
      const d = mytcPiuGiorni_(oggi, avanti);
      return { da: d, a: d, etichetta: avanti === 0 ? 'oggi' : avanti === 1 ? 'domani' : mytcGiornoLungo_(d, oggi) };
    }
  }

  // 28/11, 28-11-2026, 28 novembre
  const mesi = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  let g = null, mm = null, aa = null;
  const num = s.match(/\b(\d{1,2}) (\d{1,2})(?: (\d{2,4}))?\b/);
  if (num && Number(num[2]) >= 1 && Number(num[2]) <= 12 && Number(num[1]) <= 31 && !/\bu\d/.test(s.slice(Math.max(0, num.index - 2), num.index + 1))) {
    g = Number(num[1]); mm = Number(num[2]); aa = num[3] ? Number(num[3].length === 2 ? '20' + num[3] : num[3]) : null;
  }
  const tx = s.match(/\b(\d{1,2}) (gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\b/);
  if (tx) { g = Number(tx[1]); mm = mesi.indexOf(tx[2]) + 1; }
  if (g && mm) {
    const anno0 = Number(oggi.slice(0, 4));
    let y = aa || anno0;
    let d = y + '-' + mytcDue_(mm) + '-' + mytcDue_(g);
    if (!aa && d < mytcPiuGiorni_(oggi, -60)) { y++; d = y + '-' + mytcDue_(mm) + '-' + mytcDue_(g); }
    return { da: d, a: d, etichetta: d === oggi ? 'oggi' : mytcGiornoLungo_(d, oggi) };
  }
  return null;
}

// ------------------------------------------------------------
// Piccoli aiuti
// ------------------------------------------------------------

function mytcDue_(n) { return (n < 10 ? '0' : '') + n; }
function mytcGiorniMese_(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

function mytcPiuGiorni_(iso, n) {
  const p = iso.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  return d.getUTCFullYear() + '-' + mytcDue_(d.getUTCMonth() + 1) + '-' + mytcDue_(d.getUTCDate());
}

function mytcGiornoSettimana_(iso) {
  const p = iso.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
}

function mytcGiornoBreve_(iso, oggi) {
  if (iso === oggi) return 'Oggi';
  if (iso === mytcPiuGiorni_(oggi, 1)) return 'Domani';
  if (iso === mytcPiuGiorni_(oggi, -1)) return 'Ieri';
  const nomi = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
  const p = iso.split('-');
  return nomi[mytcGiornoSettimana_(iso)] + ' ' + p[2] + '/' + p[1];
}

function mytcGiornoLungo_(iso, oggi) {
  if (iso === oggi) return 'oggi';
  if (iso === mytcPiuGiorni_(oggi, 1)) return 'domani';
  const nomi = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
  const p = iso.split('-');
  return nomi[mytcGiornoSettimana_(iso)] + ' ' + Number(p[2]) + '/' + p[1];
}

function mytcOrdina_(a, b) {
  const x = a.data + (a.ora || '00:00');
  const y = b.data + (b.ora || '00:00');
  return x < y ? -1 : x > y ? 1 : 0;
}

function mytcUnici_(lista) {
  return lista.filter(function(x, i) { return x && lista.indexOf(x) === i; });
}

function mytcUniciEventi_(lista) {
  const visti = {};
  return lista.filter(function(e) {
    const k = e.data + e.ora + e.titolo;
    if (visti[k]) return false;
    visti[k] = true;
    return true;
  });
}

function mytcElenco_(lista) {
  if (lista.length <= 1) return lista.join('');
  return lista.slice(0, -1).join(', ') + ' e ' + lista[lista.length - 1];
}

function mytcNomeBreve_(sq) {
  return ({ '2° Div. F.': '2 Div', '3° Div. F': '3 Div', 'U14 F.': 'U14 FIPAV', 'U14 C.S.I.': 'U14 CSI',
    'U12 C.S.I.': 'U12', 'U17 C.S.I.': 'U17', 'Super Volley': 'Super Volley', 'MiniVolley': 'MiniVolley' })[sq] || sq;
}

/** Aggiunge il punto finale senza raddoppiarlo ("2° Div. F." resta così). */
function mytcPunto_(t) { return /[.!?]$/.test(t) ? t : t + '.'; }

/** Per la voce: "2° Div. F." -> "seconda divisione" */
function mytcSquadraParlata_(sq) {
  return ({ '2° Div. F.': 'seconda divisione', '3° Div. F': 'terza divisione', 'U14 F.': 'under 14 FIPAV',
    'U14 C.S.I.': 'under 14 CSI', 'U12 C.S.I.': 'under 12 CSI', 'U17 C.S.I.': 'under 17 CSI',
    'Super Volley': 'Super Volley', 'MiniVolley': 'Mini Volley' })[sq] || sq;
}

/** Per la voce: "sabato 28 novembre", "oggi", "domani" */
function mytcDataParlata_(iso, oggi) {
  if (iso === oggi) return 'oggi';
  if (iso === mytcPiuGiorni_(oggi, 1)) return 'domani';
  if (iso === mytcPiuGiorni_(oggi, -1)) return 'ieri';
  const giorni = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
  const mesi = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  const p = iso.split('-').map(Number);
  return giorni[mytcGiornoSettimana_(iso)] + ' ' + p[2] + ' ' + mesi[p[1] - 1];
}

function mytcMaiuscola_(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }

function mytcPulisci_(t) {
  return String(t || '').replace(/&#39;/g, '\'').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
}
// ===================== CERVELLO FINE =======================
</script>

  var micQui = !dentroCornice ||
    !!(document.featurePolicy && document.featurePolicy.allowsFeature && document.featurePolicy.allowsFeature('microphone'));

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function(c) {

  function leggi(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function scrivi(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- Dati: caricati una volta, poi risposte immediate ---------- */
  function caricaDati(dopo) {
    if (dopo) inAttesa.push(dopo);
    if (inCarica || !conServer) return;
    inCarica = true;
    stato.classList.add('carica');
    function ok(d) {
        MYTC_D = d;
        appUrl = d && d.appUrl || appUrl;
        caricatiIl = Date.now();
        inCarica = false;
        stato.classList.remove('carica');
        var fare = inAttesa; inAttesa = [];
        fare.forEach(function(f) { f(); });
    }
    function ko(e) {
        console.warn('Chat MyT: dati non caricati', e);
        motivoErrore = String(e && e.message || e || '');
        inCarica = false;
        stato.classList.remove('carica');
        var fare = inAttesa; inAttesa = [];
        fare.forEach(function(f) { f(e || true); });
    }
    if (window.MYTC_FONTE) {
      // Pagina vocale: i dati arrivano dall'indirizzo pubblico della app
      // JSONP: un <script> che chiama mytcRicevi(dati). Funziona anche su iPhone.
      var finito = false;
      var tag = document.createElement('script');
      var limite = setTimeout(function() { if (!finito) { finito = true; tag.remove(); ko(new Error('tempo scaduto')); } }, 30000);
      window.mytcRicevi = function(d) {
        if (finito) return;
        finito = true;
        clearTimeout(limite);
        tag.remove();
        if (!d || !d.eventi) { ko(new Error(d && d.errore || 'dati vuoti')); return; }
        ok(d);
      };
      tag.onerror = function() { if (!finito) { finito = true; clearTimeout(limite); ko(new Error('indirizzo non raggiungibile')); } };
      // Caricato ma senza dati: l'app ha risposto con una pagina normale
      tag.onload = function() {
        setTimeout(function() {
          if (!finito) { finito = true; clearTimeout(limite); tag.remove(); ko(new Error('senza-riga')); }
        }, 300);
      };
      tag.src = window.MYTC_FONTE + (window.MYTC_FONTE.indexOf('?') === -1 ? '?' : '&') + 'callback=mytcRicevi&t=' + Date.now();
      document.head.appendChild(tag);
    } else {
      google.script.run.withSuccessHandler(ok).withFailureHandler(ko).datiChatMyT();
    }
  }

  // Si caricano poco dopo l'apertura della pagina, così alla prima domanda sono già pronti
  setTimeout(function() { if (!MYTC_D) caricaDati(); }, 2500);

  /* ---------- Fumetto: una volta al giorno ---------- */
  var oggiLocale = new Date().toISOString().slice(0, 10);
  if (leggi('mytc_fumetto') !== oggiLocale) {
    setTimeout(function() {
      if (radice.classList.contains('aperta')) return;
      fumetto.hidden = false;
      scrivi('mytc_fumetto', oggiLocale);
      setTimeout(function() { fumetto.hidden = true; }, 9000);
    }, 5500);
  }

  /* ---------- Voce: MyT legge le risposte ---------- */
  var sintesi = window.speechSynthesis;
  var voceIt = null;
  var voceAttiva = leggi('mytc_voce') === '1';

  function scegliVoce() {
    if (!sintesi) return;
    var voci = sintesi.getVoices().filter(function(v) { return /^it/i.test(v.lang); });
    // preferisco una voce femminile, se il telefono la dichiara
    voceIt = voci.filter(function(v) { return /alice|elsa|federica|paola|female|donna|google italiano/i.test(v.name); })[0] || voci[0] || null;
  }
  if (sintesi) {
    scegliVoce();
    if ('onvoiceschanged' in sintesi) sintesi.onvoiceschanged = scegliVoce;
  } else {
    tastoVoce.hidden = true;
  }

  function aggiornaTastoVoce() {
    tastoVoce.setAttribute('aria-pressed', voceAttiva ? 'true' : 'false');
    tastoVoce.textContent = voceAttiva ? '🔊 Voce' : '🔈 Voce';
  }
  aggiornaTastoVoce();

  tastoVoce.addEventListener('click', function() {
    voceAttiva = !voceAttiva;
    scrivi('mytc_voce', voceAttiva ? '1' : '0');
    aggiornaTastoVoce();
    if (!voceAttiva && sintesi) sintesi.cancel();
    if (voceAttiva) parla('Ciao! Ora ti leggo le risposte.');
  });

  var ORDINALI = ['', 'prima', 'seconda', 'terza', 'quarta', 'quinta', 'sesta', 'settima', 'ottava', 'nona', 'decima',
    'undicesima', 'dodicesima', 'tredicesima', 'quattordicesima', 'quindicesima', 'sedicesima'];

  function perLaVoce(t) {
    return String(t || '')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
      .replace(/(\d+)ª/g, function(m, n) { return ORDINALI[Number(n)] || n; })
      .replace(/2° Div\. F\./g, 'seconda divisione').replace(/3° Div\. F/g, 'terza divisione')
      .replace(/U(\d\d) C\.S\.I\./g, 'under $1 CSI').replace(/U(\d\d) F\./g, 'under $1 FIPAV')
      .replace(/\bvs\b/g, 'contro')
      .replace(/(\d{1,2}):(\d{2})–(\d{1,2}):(\d{2})/g, '$1 e $2')
      .replace(/•/g, '').replace(/\s+/g, ' ').trim();
  }

  function testoDaLeggere(r) {
    var pezzi = [r.testo || ''];
    (r.schede || []).slice(0, 5).forEach(function(s) { if (s.voce) pezzi.push(s.voce + '.'); });
    if ((r.schede || []).length > 5) pezzi.push('E altri ' + (r.schede.length - 5) + ', li trovi scritti.');
    (r.nomi || []).forEach(function(g) {
      pezzi.push(g.nomi.length <= 20 ? g.nomi.join(', ') + '.' : 'I nomi li trovi scritti qui sotto.');
    });
    return perLaVoce(pezzi.join(' '));
  }

  function parla(t) {
    if (!sintesi || !t) return;
    sintesi.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'it-IT';
    if (voceIt) u.voice = voceIt;
    u.rate = 1.08;
    u.pitch = 1.1;
    sintesi.speak(u);
  }

  /* ---------- Microfono: la domanda a voce ---------- */
  var Riconoscimento = window.SpeechRecognition || window.webkitSpeechRecognition;
  var ascolto = null;
  var daVoce = false;

  function micBloccato() {
    rispostaMyT({
      testo: window.MYTC_FONTE
        ? (/iPhone|iPad|iPod/i.test(navigator.userAgent)
          ? 'Il microfono è bloccato 😕 Su iPhone serve:\n1. Impostazioni → Generali → Tastiera → "Abilita dettatura" acceso (e Siri attivo).\n2. In Safari tocca "aA" accanto all\'indirizzo → Impostazioni sito web → Microfono → Consenti.\nPoi ricarica la pagina. Intanto puoi usare il 🎤 della tastiera.'
          : 'Il microfono è bloccato 😕 Tocca il lucchetto accanto all\'indirizzo, scegli Microfono: Consenti e ricarica la pagina. Intanto puoi usare il 🎤 della tastiera.')
        : 'Su questo telefono il microfono qui dentro è bloccato 😕 Tocca la casella e usa il 🎤 della tastiera per dettare la domanda: poi premi invio.'
    });
  }

  mic.addEventListener('click', function() {
    if (sintesi) sintesi.cancel();
    if (ascolto) { ascolto.stop(); return; }
    if (!micQui) {
      // Dentro la cornice di Google il microfono è spento: si apre MyT a voce in una scheda nuova
      window.open(PAGINA_VOCE, '_blank', 'noopener');
      rispostaMyT({ testo: 'Ti ho aperto MyT a voce in una scheda nuova 🎤 La prima volta il browser chiede il permesso per il microfono: rispondi "Consenti".' }, true);
      return;
    }
    if (!Riconoscimento) { micBloccato(); campo.focus(); return; }

    var r = new Riconoscimento();
    r.lang = 'it-IT';
    r.interimResults = true;
    r.maxAlternatives = 1;
    var finale = '';
    ascolto = r;
    mic.classList.add('ascolta');
    campo.placeholder = 'Ti ascolto…';
    micTesto.textContent = 'Ti ascolto… parla pure';

    r.onresult = function(e) {
      var t = '';
      for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      campo.value = t;
      if (e.results[e.results.length - 1].isFinal) finale = t;
    };
    r.onerror = function(e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') micBloccato();
    };
    r.onend = function() {
      ascolto = null;
      mic.classList.remove('ascolta');
      campo.placeholder = '…oppure scrivi qui';
      micTesto.textContent = 'Tocca e parla con MyT';
      var t = (finale || campo.value).trim();
      if (t) { daVoce = true; chiedi(t); }
    };
    try { r.start(); } catch (e) { ascolto = null; mic.classList.remove('ascolta'); micBloccato(); }
  });

  /* ---------- Apertura e chiusura ---------- */
  function apriChat() {
    radice.classList.add('aperta');
    finestra.hidden = false;
    fumetto.hidden = true;
    apri.setAttribute('aria-expanded', 'true');
    if (!MYTC_D || Date.now() - caricatiIl > DIECI_MINUTI) caricaDati();
    if (!iniziata) {
      iniziata = true;
      rispostaMyT({
        testo: 'Ciao! Sono MyT, la giocatrice virtuale del Team Volley C8 🏐\nChiedimi di partite, allenamenti, risultati, classifiche, atlete e staff. Tocca il microfono qui sotto e parlami!',
        suggerimenti: ['Quando gioca la U14?', 'Allenamenti di oggi', 'Partite del weekend', 'Risultati', 'Classifiche']
      }, true);
    }
    if (window.matchMedia('(min-width: 521px)').matches) campo.focus();
  }

  function chiudiChat() {
    if (window.MYTC_PAGINA_SOLA) {
      if (sintesi) sintesi.cancel();
      location.href = window.MYTC_APP_URL || appUrl || '/';
      return;
    }
    radice.classList.remove('aperta');
    finestra.hidden = true;
    apri.setAttribute('aria-expanded', 'false');
    if (sintesi) sintesi.cancel();
    if (ascolto) ascolto.abort();
    apri.focus();
  }

  apri.addEventListener('click', function() { finestra.hidden ? apriChat() : chiudiChat(); });
  fumetto.addEventListener('click', apriChat);
  chiudi.addEventListener('click', chiudiChat);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && !finestra.hidden) chiudiChat(); });

  /* ---------- Messaggi ---------- */
  function giu() { messaggi.scrollTop = messaggi.scrollHeight; }

  function togliSuggerimenti() {
    var vecchi = messaggi.querySelectorAll('.mytc-sugg');
    for (var i = 0; i < vecchi.length; i++) vecchi[i].remove();
  }

  function mioMessaggio(t) {
    var r = document.createElement('div');
    r.className = 'mytc-riga io';
    r.innerHTML = '<div class="mytc-bolla">' + esc(t) + '</div>';
    messaggi.appendChild(r);
    giu();
  }

  function scheda(s) {
    var alto = '';
    if (s.squadra) alto += '<span class="mytc-squadra">' + esc(s.squadra) + '</span>';
    if (s.etichetta) alto += '<span class="mytc-etichetta">' + esc(s.etichetta) + '</span>';
    return '<div class="mytc-scheda ' + esc(s.tipo) + '">' +
      '<span class="mytc-ico" aria-hidden="true">' + (ICONE[s.tipo] || '📅') + '</span>' +
      '<div class="mytc-s-testo">' +
        (alto ? '<div class="mytc-s-alto">' + alto + '</div>' : '') +
        '<div class="mytc-s-titolo">' + esc(s.titolo) + '</div>' +
        (s.quando ? '<div class="mytc-s-quando">' + esc(s.quando) + '</div>' : '') +
        (s.luogo ? '<div class="mytc-s-luogo">' + (/^(partita|allenamento|evento)$/.test(s.tipo) ? '📍 ' : '') + esc(s.luogo) + '</div>' : '') +
      '</div></div>';
  }

  function rispostaMyT(r, muta) {
    r = r || {};
    var html = '<div class="mytc-bolla">' + esc(r.testo || '') + '</div>';
    (r.schede || []).forEach(function(s) { html += scheda(s); });
    if (r.tabella) {
      html += '<div class="mytc-tabella"><div class="mytc-tabella-titolo">' + esc(r.tabella.titolo) + '</div><table>' +
        r.tabella.righe.map(function(x) {
          return '<tr' + (x.noi ? ' class="noi"' : '') + '><td>' + esc(x.pos) + '</td><td>' + esc(x.nome) + '</td><td>' + esc(x.punti) + '</td></tr>';
        }).join('') + '</table></div>';
    }
    (r.nomi || []).forEach(function(g) {
      html += '<div class="mytc-nomi"><strong>' + esc(g.titolo) + '</strong><ul>' +
        g.nomi.map(function(n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>';
    });
    if (r.link && appUrl) {
      html += '<a class="mytc-link" target="_top" href="' + esc(appUrl + '?page=' + encodeURIComponent(r.link.pagina)) + '">' + esc(r.link.testo) + ' →</a>';
    }

    var riga = document.createElement('div');
    riga.className = 'mytc-riga';
    riga.innerHTML = GIOCATRICE + '<div class="mytc-contenuto">' + html + '</div>';
    messaggi.appendChild(riga);

    if (r.suggerimenti && r.suggerimenti.length) {
      var sug = document.createElement('div');
      sug.className = 'mytc-sugg';
      r.suggerimenti.forEach(function(t) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = t;
        b.addEventListener('click', function() { chiedi(t); });
        sug.appendChild(b);
      });
      messaggi.appendChild(sug);
    }
    giu();

    // Legge ad alta voce se la voce è accesa o se la domanda è stata fatta a voce
    if (!muta && (voceAttiva || daVoce)) parla(testoDaLeggere(r));
    daVoce = false;
  }

  function chiedi(t) {
    t = String(t || '').trim();
    if (!t || occupata) return;
    occupata = true;
    invia.disabled = true;
    togliSuggerimenti();
    mioMessaggio(t);
    campo.value = '';

    var attesa = document.createElement('div');
    attesa.className = 'mytc-riga';
    attesa.innerHTML = GIOCATRICE + '<div class="mytc-bolla mytc-scrive" aria-label="MyT sta scrivendo"><i></i><i></i><i></i></div>';
    messaggi.appendChild(attesa);
    giu();

    function fine(r) {
      attesa.remove();
      occupata = false;
      invia.disabled = false;
      rispostaMyT(r);
    }

    function rispondi(errore) {
      if (!MYTC_D) {
        fine({ testo: window.MYTC_FONTE
          ? (motivoErrore === 'senza-riga'
            ? 'Non riesco a leggere i dati dell\'app 😕 L\'app risponde, ma non con i dati per la chat: in Codice.gs manca la riga in doGet (rispostaDatiChatMyT_) oppure non è stata fatta la Nuova versione del deployment.'
            : /^dati non disponibili/.test(motivoErrore)
              ? 'L\'app ha provato a darmi i dati ma è andata in errore 😕 Dettaglio per chi la gestisce: ' + motivoErrore
              : 'Non riesco a leggere i dati dell\'app 😕 (' + (motivoErrore || 'nessuna risposta') + '). Controlla che il deployment sia per "Chiunque" e riprova.')
          : 'Non riesco a collegarmi in questo momento 😕 Controlla la connessione e riprova.', suggerimenti: [t] });
        caricaDati();
        return;
      }
      var r;
      try { r = mytcRispondi_(t.slice(0, 300)); }
      catch (e) {
        console.error('Chat MyT:', e);
        r = { testo: 'Ops, qualcosa non ha funzionato 😅 Riprova tra poco.', suggerimenti: ['Prossime partite'] };
      }
      setTimeout(function() { fine(r); }, 180);   // un attimo di "sta scrivendo"
    }

    if (!conServer) { fine({ testo: 'La chat funziona solo dentro la app MyT.' }); return; }
    if (MYTC_D && Date.now() - caricatiIl < DIECI_MINUTI) { rispondi(); return; }
    if (MYTC_D) { rispondi(); caricaDati(); return; }   // rispondo subito e aggiorno per la prossima
    caricaDati(rispondi);
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    chiedi(campo.value);
  });

  // Pagina vocale: la chat è già aperta a tutto schermo
  if (window.MYTC_PAGINA_SOLA) {
    radice.classList.add('sola');
    caricaDati();
    apriChat();
  }
})();
</script>

</body>
